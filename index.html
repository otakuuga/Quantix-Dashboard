<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantix FinTech Dashboard</title>
    <style>
      :root { --bg:#f3f4f6; --surface:#fff; --text:#0f172a; --muted:#475569; --primary:#0284c7; }
      .dark { --bg:#020617; --surface:#0f172a; --text:#e2e8f0; --muted:#94a3b8; --primary:#38bdf8; }
      *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
      .container{max-width:1200px;margin:0 auto;padding:24px}
      .card{background:var(--surface);border:1px solid #33415533;border-radius:12px;padding:16px}
      .grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
      .g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
      .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
      .muted{color:var(--muted)} .btn{border:1px solid #64748b66;background:transparent;color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}
      .btn-primary{background:var(--primary);color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
      input,select{padding:8px;border-radius:8px;border:1px solid #64748b66;background:var(--surface);color:var(--text)}
      table{width:100%;border-collapse:collapse} th,td{padding:8px;border-top:1px solid #33415533;text-align:left;font-size:14px}
      .step{display:none}.step.active{display:block}
      .pill{padding:4px 10px;border-radius:999px;background:#33415522;font-size:12px}
      .progress{height:8px;background:#33415533;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--primary);width:33%;transition:width .2s}
      .chart{height:220px;display:flex;align-items:end;gap:10px;padding-top:24px}
      .line{height:120px;width:100%;background:linear-gradient(180deg,#0ea5e933,#0ea5e900);border-radius:8px;position:relative}
      .line::after{content:'';position:absolute;left:8px;right:8px;top:40%;border-top:2px solid var(--primary);transform:skewX(-18deg)}
      .candle{width:16px;background:#10b981}.candle.down{background:#ef4444}
      .pie{width:160px;height:160px;border-radius:50%;margin:auto;background:conic-gradient(#0ea5e9 0 44%,#6366f1 44% 65%,#14b8a6 65% 83%,#f59e0b 83% 100%)}
    </style>
  </head>
  <body>
    <main class="container" aria-label="FinTech dashboard">
      <div class="row">
        <div><h1>Quantix FinTech UI Kit</h1><p class="muted">Runnable local demo without package installs</p></div>
        <button id="themeBtn" class="btn" aria-label="Toggle color theme">Switch Theme</button>
      </div>

      <section class="grid g4" aria-label="Metrics">
        <article class="card"><div class="muted">AUM</div><h2>$5.42M</h2><div style="color:#16a34a">+2.23%</div></article>
        <article class="card"><div class="muted">Daily Volume</div><h2>$832K</h2><div style="color:#dc2626">-1.04%</div></article>
        <article class="card"><div class="muted">Verified Accounts</div><h2>1,284</h2><div style="color:#16a34a">+4.71%</div></article>
        <article class="card"><div class="muted">Failed Transactions</div><h2>18</h2><div style="color:#16a34a">-0.93%</div></article>
      </section>

      <section class="grid g2" style="margin-top:16px">
        <div class="card"><h3>Revenue Trend</h3><div class="line" role="img" aria-label="Line chart"></div></div>
        <div class="card"><h3>OHLC Movement</h3><div class="chart" role="img" aria-label="Candlestick chart"><div class="candle" style="height:80px"></div><div class="candle down" style="height:58px"></div><div class="candle" style="height:110px"></div><div class="candle down" style="height:72px"></div><div class="candle" style="height:125px"></div></div></div>
        <div class="card"><h3>Portfolio Allocation</h3><div class="pie" role="img" aria-label="Pie chart"></div></div>
      </section>

      <section class="grid g2" style="margin-top:16px">
        <div class="card" aria-label="KYC wizard">
          <div class="row"><h3>KYC Workflow</h3><span id="kycStatus" class="pill">In Progress</span></div>
          <div class="progress"><div id="bar" class="bar"></div></div>
          <div id="s1" class="step active"><p><input id="name" placeholder="Full name" /></p><p><input id="email" placeholder="Email" /></p></div>
          <div id="s2" class="step"><p><input id="country" placeholder="Country" /></p><p><select id="idType"><option>passport</option><option>driver_license</option><option>national_id</option></select></p><p><input id="idNo" placeholder="ID Number" /></p></div>
          <div id="s3" class="step"><p><input type="file" /></p></div>
          <div class="row"><button id="back" class="btn">Back</button><button id="next" class="btn-primary">Next</button></div>
        </div>

        <div class="card" aria-label="Transactions">
          <div class="row"><input id="q" placeholder="Search" /><button id="csv" class="btn-primary">Export CSV</button></div>
          <table><thead><tr><th>ID</th><th>Account</th><th>Amount</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table>
        </div>
      </section>
    </main>

    <script>
      const root=document.documentElement,themeBtn=document.getElementById('themeBtn');
      themeBtn.onclick=()=>root.classList.toggle('dark');

      let step=1; const bar=document.getElementById('bar'), next=document.getElementById('next'), back=document.getElementById('back'), status=document.getElementById('kycStatus');
      const show=()=>{[1,2,3].forEach(i=>document.getElementById('s'+i).classList.toggle('active',i===step));bar.style.width=`${step*33.33}%`;back.disabled=step===1;next.textContent=step===3?'Submit KYC':'Next';};
      back.onclick=()=>{step=Math.max(1,step-1);show()};
      next.onclick=()=>{if(step<3){step++;show()}else{status.textContent='Submitted';}};

      const data=Array.from({length:30},(_,i)=>({id:`TX-${String(i+1).padStart(4,'0')}`,account:`ACCT-${1000+i%8}`,amount:(Math.random()*5000).toFixed(2),status:['pending','completed','failed'][i%3]}));
      const rows=document.getElementById('rows');
      const render=(q='')=>{rows.innerHTML='';data.filter(d=>d.id.includes(q)||d.account.includes(q)).slice(0,12).forEach(d=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${d.id}</td><td>${d.account}</td><td>$${d.amount}</td><td>${d.status}</td>`;rows.appendChild(tr);});};
      render(); document.getElementById('q').oninput=(e)=>render(e.target.value);
      document.getElementById('csv').onclick=()=>{const lines=['id,account,amount,status',...data.map(d=>`${d.id},${d.account},${d.amount},${d.status}`)];const b=new Blob([lines.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='transactions.csv';a.click();};
    </script>
  </body>
</html>
